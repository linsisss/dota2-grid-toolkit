const camera = new THREE.PerspectiveCamera(vfov, 16 / 9, 50, 4000);

  const gx = L[i - CROP.w + 1] + 2 * L[i + 1] + L[i + CROP.w + 1] - L[i - CROP.w - 1] - 2 * L[i - 1] - L[i + CROP.w - 1];
  const gy = L[i + CROP.w - 1] + 2 * L[i + CROP.w] + L[i + CROP.w + 1] - L[i - CROP.w - 1] - 2 * L[i - CROP.w] - L[i - CROP.w + 1]; G[i] = Math.hypot(gx, gy); }
